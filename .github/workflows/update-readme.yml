name: Auto Update README on Release

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-readme:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Update README with latest APK
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python3 - << 'EOF'
          import os
          import re
          import json
          import urllib.request

          event_path = os.environ.get("GITHUB_EVENT_PATH")
          repo = os.environ.get("GITHUB_REPOSITORY", "boxlab-dev/atlasbasket_analytics")
          token = os.environ.get("GITHUB_TOKEN")

          apk_name = None
          tag_name = None

          # Check event payload if triggered by release
          if event_path and os.path.exists(event_path):
              try:
                  with open(event_path, "r", encoding="utf-8") as f:
                      event_data = json.load(f)
                  release = event_data.get("release", {})
                  tag_name = release.get("tag_name")
                  for asset in release.get("assets", []):
                      name = asset.get("name", "")
                      if name.lower().endswith(".apk"):
                          apk_name = name
                          break
              except Exception as e:
                  print("Could not read event payload:", e)

          # Fallback to API if not in payload
          if not apk_name or not tag_name:
              headers = {"User-Agent": "GitHub-Action"}
              if token:
                  headers["Authorization"] = f"token {token}"
              url = f"https://api.github.com/repos/{repo}/releases/latest"
              try:
                  req = urllib.request.Request(url, headers=headers)
                  with urllib.request.urlopen(req) as resp:
                      data = json.loads(resp.read().decode("utf-8"))
                      tag_name = data.get("tag_name", "v1.0.1")
                      for asset in data.get("assets", []):
                          name = asset.get("name", "")
                          if name.lower().endswith(".apk"):
                              apk_name = name
                              break
              except Exception as e:
                  print("API fetch failed:", e)

          if not tag_name:
              tag_name = "v1.0.1"
          if not apk_name:
              apk_name = f"atlasbasket-{tag_name}.apk"

          clean_tag = tag_name if tag_name.startswith("v") else f"v{tag_name}"

          readme_file = "README.md"
          if not os.path.exists(readme_file):
              print("README.md not found!")
              exit(0)

          with open(readme_file, "r", encoding="utf-8") as f:
              content = f.read()

          # Replace download URL in links
          content = re.sub(
              r"https://github\.com/[^/]+/[^/]+/releases/latest/download/[^\s\"'>]+\.apk",
              f"https://github.com/{repo}/releases/latest/download/{apk_name}",
              content
          )
          # Replace badge version
          content = re.sub(
              r"https://img\.shields\.io/badge/Download-APK%20\([^)]+\)",
              f"https://img.shields.io/badge/Download-APK%20({clean_tag})",
              content
          )
          # Replace text in installation step
          content = re.sub(
              r"Κατεβάστε το \[[^\]]+\.apk\]",
              f"Κατεβάστε το [{apk_name}]",
              content
          )

          with open(readme_file, "w", encoding="utf-8") as f:
              f.write(content)

          print(f"Successfully processed README: Tag = {clean_tag}, APK = {apk_name}")
          EOF

      - name: Commit and push changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if git diff --quiet README.md; then
            echo "No changes in README.md"
          else
            git add README.md
            git commit -m "Auto-update README with latest release [skip ci]"
            git push
          fi
